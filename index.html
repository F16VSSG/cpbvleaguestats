const SUPABASE_URL="https://hidbescnzigqlqwgxqrl.supabase.co";
const SUPABASE_KEY="sb_publishable_XjhQxfgT1eqbbsm9GEwMQw_36xzuVDH";
const API=SUPABASE_URL+"/rest/v1/games";
const MAX_ROUNDS=24;
let games=[];
const headers={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Accept-Profile":"public","Content-Profile":"public"};
const home=document.getElementById("home"),away=document.getElementById("away"),homeScore=document.getElementById("homeScore"),awayScore=document.getElementById("awayScore"),standings=document.getElementById("standings"),history=document.getElementById("history"),historyRound=document.getElementById("historyRound"),entryRound=document.getElementById("entryRound");
function fillTeams(){const o=teams.map(t=>`<option value="${t}">${t}</option>`).join("");home.innerHTML=o;away.innerHTML=o;away.value="LG";const rounds=Array.from({length:MAX_ROUNDS},(_,i)=>`<option value="${i+1}">${i+1}라운드</option>`).join("");historyRound.innerHTML=rounds;entryRound.innerHTML=rounds;} 
document.querySelectorAll(".nav button").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b===btn));document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===btn.dataset.page));}));
historyRound.addEventListener("change",renderHistory);
async function loadGames(){
  try{
    const r=await fetch(API+"?select=id,home,away,home_score,away_score,created_at,round&order=created_at.asc",{headers});
    if(!r.ok) throw new Error(await r.text());
    const rows=await r.json();
    games=rows.map(x=>({id:x.id,home:x.home,away:x.away,hs:x.home_score,as:x.away_score,time:x.created_at,round:Number(x.round)||1}));
    render();
  }catch(e){console.error(e);alert("경기 기록을 불러오지 못했습니다. Supabase RLS 정책을 확인해주세요.");}
}
function getStats(){const s={};teams.forEach(t=>s[t]={team:t,g:0,w:0,d:0,l:0,rf:0,ra:0});games.forEach(x=>{let h=s[x.home],a=s[x.away];if(!h||!a)return;h.g++;a.g++;h.rf+=x.hs;h.ra+=x.as;a.rf+=x.as;a.ra+=x.hs;if(x.hs>x.as){h.w++;a.l++;}else if(x.hs<x.as){a.w++;h.l++;}else{h.d++;a.d++;}});return Object.values(s).sort((a,b)=>{let aw=a.g?a.w/a.g:0,bw=b.g?b.w/b.g:0;return bw-aw||(b.rf-b.ra)-(a.rf-a.ra)||b.rf-a.rf;});}
function getStreak(team){
 const played=games.filter(g=>g.home===team||g.away===team).slice().sort((a,b)=>new Date(b.time)-new Date(a.time));
 if(!played.length)return "-";
 const result=g=>{const score=g.home===team?(g.hs-g.as):(g.as-g.hs);return score>0?"승":score<0?"패":"무";};
 const kind=result(played[0]);let count=0;
 for(const g of played){if(result(g)!==kind)break;count++;}
 return `${count}${kind}`;
}
function render(){
 const stats=getStats(),leader=stats[0];
 standings.innerHTML=stats.map((s,i)=>{let wp=s.g?(s.w/s.g).toFixed(3):"-",diff=s.rf-s.ra,logo=teamLogos[s.team],gap=i===0?"-":(((leader.w-s.w)+(s.l-leader.l))/2).toFixed(1);return `<tr><td class="rank">${i+1}</td><td><div class="team-cell"><img class="team-logo" src="${logo}" alt="${s.team} 로고"><span class="team-name">${s.team}</span></div></td><td>${s.g}</td><td>${gap}</td><td class="win">${s.w}</td><td>${s.d}</td><td class="loss">${s.l}</td><td>${wp}</td><td>${diff>0?"+":""}${diff}</td><td>${getStreak(s.team)}</td></tr>`}).join("");
 renderHistory();

}
function renderHistory(){const round=Number(historyRound.value||1);document.getElementById("historyRoundTitle").textContent=`${round}라운드 경기 결과`;const list=games.filter(g=>g.round===round).slice().reverse();history.innerHTML=list.length?list.map(g=>`<div class="history-row"><div><b>${g.home}</b></div><div><b>${g.away}</b></div><div><b>${g.hs} : ${g.as}</b></div><div class="small">${new Date(g.time).toLocaleDateString("ko-KR")}</div><button class="danger" onclick="deleteGame(${g.id})">삭제</button></div>`).join(""):`<div class="empty">${round}라운드에 등록된 경기가 없습니다.</div>`;}
document.getElementById("addBtn").onclick=async()=>{let h=home.value,a=away.value,hs=Number(homeScore.value),as=Number(awayScore.value),round=Number(entryRound.value||1);if(h===a)return alert("서로 다른 팀을 선택해주세요.");if(homeScore.value===""||awayScore.value===""||hs<0||as<0)return alert("점수를 정확히 입력해주세요.");try{const r=await fetch(API,{method:"POST",headers:{...headers,"Prefer":"return=representation"},body:JSON.stringify({home:h,away:a,home_score:hs,away_score:as,round})});if(!r.ok)throw new Error(await r.text());homeScore.value="";awayScore.value="";await loadGames();}catch(e){console.error(e);alert("경기 저장에 실패했습니다. Supabase RLS 정책을 확인해주세요.");}};
window.deleteGame=async id=>{if(!confirm("이 경기 기록을 삭제할까요?"))return;try{const r=await fetch(API+"?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{...headers,"Prefer":"return=minimal"}});if(!r.ok)throw new Error(await r.text());await loadGames();}catch(e){console.error(e);alert("경기 삭제에 실패했습니다. Supabase RLS 정책을 확인해주세요.");}};
document.getElementById("resetBtn").onclick=async()=>{if(!confirm("모든 경기 기록을 삭제할까요?"))return;try{const r=await fetch(API+"?id=not.is.null",{method:"DELETE",headers:{...headers,"Prefer":"return=minimal"}});if(!r.ok)throw new Error(await r.text());await loadGames();}catch(e){console.error(e);alert("전체 기록 삭제에 실패했습니다. Supabase RLS 정책을 확인해주세요.");}};
fillTeams();loadGames();
</script>
